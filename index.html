    AudioSys.silenceContinuous();
    menuCursor = 0;
    gameState = STATE_PAUSED;
  }

  function openResultsMenu() {
    AudioSys.silenceContinuous();
    menuCursor = 0;
    gameState = STATE_RESULTS;
  }

  function handleMenuInput(code, items, callback) {
    if (code === KEY_UP) {
      menuCursor = (menuCursor - 1 + items.length) % items.length;
      AudioSys.playMenuMove();
    } else if (code === KEY_DOWN) {
      menuCursor = (menuCursor + 1) % items.length;
      AudioSys.playMenuMove();
    } else if (code === KEY_OK || code === KEY_LEFT || code === KEY_RIGHT) {
      var itemLabel = items[menuCursor].label;
      if ((code === KEY_LEFT || code === KEY_RIGHT) && itemLabel !== "CAMERA VIEW" && itemLabel !== "SOUND") {
        return;
      }
      AudioSys.playMenuSelect();
      callback(menuCursor);
    }
  }

  function toggleCameraSetting() {
    settings.cameraView = (settings.cameraView === CAM_CHASE) ? CAM_TOPDOWN : CAM_CHASE;
    saveSettings();
  }

  function toggleSoundSetting() {
    settings.soundEnabled = !settings.soundEnabled;
    AudioSys.updateMasterMute();
    saveSettings();
  }

  function onMainMenuSelect(idx) {
    if (idx === 0) {
      resetRace();
    } else if (idx === 1) {
      toggleCameraSetting();
    } else if (idx === 2) {
      toggleSoundSetting();
    }
  }

  function onPauseMenuSelect(idx) {
    if (idx === 0) {
      gameState = STATE_RACING;
    } else if (idx === 1) {
      toggleCameraSetting();
    } else if (idx === 2) {
      resetRace();
    } else if (idx === 3) {
      toggleSoundSetting();
    } else if (idx === 4) {
      openMainMenu();
    }
  }

  function onResultsMenuSelect(idx) {
    if (idx === 0) {
      resetRace();
    } else if (idx === 1) {
      openMainMenu();
    }
  }

  // ============================================================================
  // 10. GAMEPLAY PHYSICS & AI UPDATE LOOP
  // ============================================================================
  function updateIntro(dt) {
    introTimer += dt;
    if (introPhase === 0) {
      // Flyover camera moving backwards towards the starting grid
      introCamZ -= dt * 620;
      if (introTimer >= 5.2 || introCamZ <= player.z) {
        introPhase = 1;
        introTimer = 0;
        countdownLastBeep = 4;
      }
    } else {
      // 3 - 2 - 1 - GO Countdown
      var rem = 3.5 - introTimer;
      var countNum = Math.ceil(rem);
      if (countNum <= 3 && countNum >= 1 && countNum < countdownLastBeep) {
        countdownLastBeep = countNum;
        AudioSys.playCountdown(false);
      } else if (countNum <= 0 && countdownLastBeep > 0) {
        countdownLastBeep = 0;
        AudioSys.playCountdown(true);
      }
      if (introTimer >= 4.1) {
        gameState = STATE_RACING;
        throttleAssistTimer = 1.8;
      }
    }
  }

  function updateRacing(dt) {
    var segLen = currentLevel.segmentLength;
    var curSegIdx = Math.floor(player.z / segLen) % segments.length;
    var curSeg = segments[curSegIdx];

    // Timers
    totalRaceTime += dt;
    raceTimeLeft -= dt;
    if (hudPopupTimer > 0) hudPopupTimer -= dt;
    if (player.shiftTimer > 0) player.shiftTimer -= dt;
    if (player.shakeTime > 0) player.shakeTime -= dt;
    if (throttleAssistTimer > 0) throttleAssistTimer -= dt;
    if (nitroBurstTimer > 0) nitroBurstTimer -= dt;

    // Check time expiration
    if (raceTimeLeft <= 0) {
      raceTimeLeft = 0;
      raceWon = false;
      openResultsMenu();
      return;
    }

    // Determine effective throttle (supports direct Up hold + TV remote thumb assist)
    var hasThrottle = keys.up || (throttleAssistTimer > 0 && (keys.left || keys.right || nitroBurstTimer > 0));
    if (keys.down) hasThrottle = false;

    // Nitro logic
    var wantNitro = (keys.ok || nitroBurstTimer > 0) && player.nitro > 1 && !keys.down;
    if (wantNitro) {
      player.isBoosting = true;
      hasThrottle = true;
      player.nitro = Math.max(0, player.nitro - dt * 23);
      if (player.nitro <= 1) {
        player.isBoosting = false;
        nitroBurstTimer = 0;
      }
    } else {
      player.isBoosting = false;
      // Passive slow recharge
      player.nitro = Math.min(100, player.nitro + dt * 3.2);
    }

    // Acceleration, Braking, Reverse & Coasting
    var targetTopSpeed = player.isBoosting ? player.nitroMaxSpeed : player.maxSpeed;
    var speedRatio = Math.max(0, player.speed) / player.maxSpeed;

    if (keys.down) {
      if (player.speed > 100) {
        player.speed -= dt * 8800; // Braking
      } else {
        player.speed = Math.max(-2800, player.speed - dt * 2600); // Reverse
      }
    } else if (hasThrottle) {
      var accelRate = player.isBoosting ? 5800 : (3900 * (1.15 - speedRatio * 0.45));
      player.speed += dt * accelRate;
      if (player.speed > targetTopSpeed) {
        player.speed -= dt * 3500;
      }
    } else {
      // Gentle coasting
      if (player.speed > 0) {
        player.speed = Math.max(0, player.speed - dt * 1650);
      } else if (player.speed < 0) {
        player.speed = Math.min(0, player.speed + dt * 2200);
      }
    }

    // Steering & Drift Physics
    var steerInput = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    if (steerInput !== 0 && Math.abs(player.speed) > 150) {
      var steerRate = 1.95 * (0.45 + 0.55 * Math.min(1, Math.abs(player.speed) / player.maxSpeed));
      player.x += steerInput * steerRate * dt;

      // Initiate Drift if holding turn at high speed
      if (player.speed > player.maxSpeed * 0.68 && Math.abs(curSeg.curve) > 1.2) {
        player.isDrifting = true;
        player.driftAngle += (steerInput * 1.15 - player.driftAngle) * dt * 8;
        // Drift refills Nitro!
        player.nitro = Math.min(100, player.nitro + dt * 11.5);
      } else {
        player.isDrifting = false;
        player.driftAngle += (steerInput * 0.35 - player.driftAngle) * dt * 10;
      }
    } else {
      player.isDrifting = false;
      player.driftAngle += (0 - player.driftAngle) * dt * 10;
    }

    // Centrifugal curve force pushing car outward
    player.x -= (curSeg.curve * 0.43) * (speedRatio * speedRatio) * dt;

    // Apply collision bounce decay
    if (Math.abs(player.bounceX) > 0.01) {
      player.x += player.bounceX * dt;
      player.bounceX *= Math.pow(0.05, dt);
    }

    // Off-road detection & sand dust
    if (Math.abs(player.x) > 1.06 && Math.abs(player.speed) > 1000) {
      player.isOffroad = true;
      var offroadLimit = player.maxSpeed * 0.55;
      if (player.speed > offroadLimit) {
        player.speed -= dt * 5200;
      }
      player.shakeTime = 0.08;
      player.shakeMag = 4;

      // Roadside prop collision check
      if (Math.abs(player.x) > 1.32 && player.speed > 3800) {
        for (var sp = 0; sp < curSeg.sprites.length; sp++) {
          var prop = curSeg.sprites[sp];
          if (Math.abs(player.x - prop.offset) < 0.28) {
            triggerCrash(player.x > 0 ? -1.8 : 1.8, 0.55);
            player.x = player.x > 0 ? 1.15 : -1.15;
            break;
          }
        }
      }
    } else {
      player.isOffroad = false;
    }

    // Clamp lateral boundary
    player.x = Math.max(-2.1, Math.min(2.1, player.x));

    // Advance player Z
    player.z += player.speed * dt;
    if (player.z < 500) player.z = 500;

    // Automatic 6-Speed Gearbox & RPM Calculation
    updateGearAndRPM(hasThrottle);

    // Spawn Exhaust / Drift / Offroad Particles
    if (player.isDrifting) {
      spawnParticle(0, WIDTH * 0.5 - 42, HEIGHT - 48, (Math.random() - 0.5) * 90, -35 - Math.random() * 40, 16, 0.45, "rgba(230,230,240,0.65)");
      spawnParticle(0, WIDTH * 0.5 + 42, HEIGHT - 48, (Math.random() - 0.5) * 90, -35 - Math.random() * 40, 16, 0.45, "rgba(230,230,240,0.65)");
    }
    if (player.isOffroad) {
      spawnParticle(1, WIDTH * 0.5 + (Math.random() - 0.5) * 95, HEIGHT - 44, (Math.random() - 0.5) * 140, -50 - Math.random() * 50, 18, 0.42, "rgba(195,135,85,0.75)");
    }
    if (player.isBoosting) {
      spawnParticle(3, WIDTH * 0.5 - 24, HEIGHT - 50, (Math.random() - 0.5) * 40, 40 + Math.random() * 60, 14, 0.18, "#48dbfb");
      spawnParticle(3, WIDTH * 0.5 + 24, HEIGHT - 50, (Math.random() - 0.5) * 40, 40 + Math.random() * 60, 14, 0.18, "#48dbfb");
    }

    // Update Checkpoints & Finish Line
    if (nextCheckpointIdx < checkpointSegments.length) {
      var cpZ = checkpointSegments[nextCheckpointIdx] * segLen;
      if (player.z >= cpZ) {
        AudioSys.playCheckpoint();
        nextCheckpointIdx++;
        if (nextCheckpointIdx >= checkpointSegments.length) {
          // Crossed Finish Line!
          raceWon = true;
          if (settings.bestTime === null || totalRaceTime < settings.bestTime) {
            settings.bestTime = totalRaceTime;
            newRecord = true;
            saveSettings();
          }
          openResultsMenu();
          return;
        } else {
          raceTimeLeft += currentLevel.checkpointBonus;
          showHudPopup("CHECKPOINT! +" + currentLevel.checkpointBonus.toFixed(0) + "s TIME BONUS", "#2ed573", 2.6);
        }
      }
    }

    // Update Traffic AI & Player-Traffic Collisions / Near-Misses
    for (var t = 0; t < traffic.length; t++) {
      var tr = traffic[t];
      tr.z += tr.speed * dt;
      if (tr.z > trackLength - 4000) {
        tr.z = 6000;
        tr.nearMissed = false;
      }

      var dz = tr.z - player.z;
      if (Math.abs(dz) < 175) {
        var dx = Math.abs(tr.x - player.x);
        if (dx < 0.30) {
          // Crash into traffic car
          triggerCrash(player.x < tr.x ? -2.2 : 2.2, 0.62);
          player.z = tr.z - 185;
        } else if (dx < 0.54 && !tr.nearMissed && player.speed > 7500) {
          // High speed Near-Miss bonus!
          tr.nearMissed = true;
          player.nitro = Math.min(100, player.nitro + 14);
          showHudPopup("NEAR MISS! +14 NITRO", "#48dbfb", 1.5);
        }
      }
    }

    // Update Rival AI Cars (Rubber-banding + Traffic Avoidance)
    var rivalsAhead = 0;
    for (var r = 0; r < rivals.length; r++) {
      var rv = rivals[r];
      var distToPlayer = rv.z - player.z;

      // Rubber-banding tuned for Level 1 (exciting close packs, beatable)
      var rubberFactor = 1.0;
      if (distToPlayer > 3200) {
        rubberFactor = 0.86;
      } else if (distToPlayer < -2600) {
        rubberFactor = 1.15;
      }

      var rvSegIdx = Math.floor(rv.z / segLen) % segments.length;
      var rvCurveSlowdown = Math.abs(segments[rvSegIdx].curve) > 2.6 ? 0.91 : 1.0;
      var targetRvSpeed = rv.baseSkill * rubberFactor * rvCurveSlowdown;

      rv.speed += (targetRvSpeed - rv.speed) * dt * 2.5;
      rv.z += rv.speed * dt;

      // Simple traffic avoidance for rivals
      rv.laneTimer -= dt;
      if (rv.laneTimer <= 0) {
        rv.laneTimer = 0.6;
        for (var tc = 0; tc < traffic.length; tc++) {
          var tCar = traffic[tc];
          if (tCar.z > rv.z && tCar.z - rv.z < 1800 && Math.abs(tCar.x - rv.x) < 0.36) {
            rv.targetX = tCar.x > 0 ? -0.62 : 0.62;
            break;
          }
        }
      }
      rv.x += (rv.targetX - rv.x) * dt * 2.8;

      // Player-Rival Collision
      if (Math.abs(rv.z - player.z) < 165 && Math.abs(rv.x - player.x) < 0.30) {
        var pushDir = player.x < rv.x ? -1.8 : 1.8;
        triggerCrash(pushDir, 0.78);
        rv.x -= pushDir * 0.15;
      }

      if (rv.z > player.z) {
        rivalsAhead++;
      }
    }
    playerPosition = 1 + rivalsAhead;

    // Update Procedural Racing Audio
    var rpmNorm = (player.rpm - 1000) / 7200;
    AudioSys.updateRacingAudio(
      dt,
      Math.max(0, Math.min(1, rpmNorm)),
      hasThrottle ? 1 : 0,
      player.isDrifting,
      player.isOffroad,
      player.isBoosting,
      player.shiftTimer
    );
  }

  function updateGearAndRPM(hasThrottle) {
    if (player.speed < -80) {
      player.gear = -1; // Reverse
      player.rpm = 1800 + (Math.abs(player.speed) / 2800) * 4500;
      return;
    }
    if (player.speed < 80 && !hasThrottle) {
      player.gear = 0; // Neutral
      player.rpm = 1050;
      return;
    }

    var thresholds = [0, 2100, 4200, 6400, 8600, 10600, 15500];
    var newGear = 1;
    for (var g = 1; g <= 6; g++) {
      if (player.speed >= thresholds[g - 1]) {
        newGear = g;
      }
    }
    if (newGear !== player.gear) {
      if (newGear > player.gear) {
        player.shiftTimer = 0.14;
      }
      player.gear = newGear;
    }

    var gMin = thresholds[player.gear - 1] * 0.72;
    var gMax = thresholds[player.gear];
    var ratio = (player.speed - gMin) / Math.max(1, gMax - gMin);
    player.rpm = 1800 + Math.max(0, Math.min(1.04, ratio)) * 6200;
  }

  function triggerCrash(bounceDir, speedRetention) {
    player.speed *= speedRetention;
    player.bounceX = bounceDir;
    player.shakeTime = 0.35;
    player.shakeMag = 14;
    AudioSys.playCrash();

    // Spawn bright crash sparks
    for (var i = 0; i < 16; i++) {
      spawnParticle(
        2,
        WIDTH * 0.5 + (Math.random() - 0.5) * 70,
        HEIGHT - 75 + (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 420,
        -120 - Math.random() * 240,
        6,
        0.38,
        (i % 2 === 0) ? "#fffa65" : "#ff9f1a"
      );
    }
  }

  // ============================================================================
  // 11. RENDERING: BEHIND-CAR PSEUDO-3D VIEW
  // ============================================================================
  var camDepth = 1 / Math.tan((LEVELS[0].fov * 0.5) * Math.PI / 180);

  function renderPseudo3D() {
    var lvl = currentLevel;
    var segLen = lvl.segmentLength;

    var camZ = (gameState === STATE_INTRO && introPhase === 0) ? introCamZ : player.z;
    var camX = (gameState === STATE_INTRO && introPhase === 0) ? Math.sin(introTimer * 0.8) * 600 : (player.x * lvl.roadWidth);

    var baseSegIdx = Math.floor(camZ / segLen) % segments.length;
    var basePercent = (camZ % segLen) / segLen;
    var baseSeg = segments[baseSegIdx];

    var playerElevation = easeInOut(baseSeg.y, baseSeg.nextY, basePercent);
    var camY = lvl.cameraHeight + playerElevation + ((gameState === STATE_INTRO && introPhase === 0) ? 450 : 0);

    // Camera Shake offset
    var shakeX = 0, shakeY = 0;
    if (player.shakeTime > 0) {
      shakeX = (Math.random() - 0.5) * player.shakeMag * 2;
      shakeY = (Math.random() - 0.5) * player.shakeMag * 2;
    }

    ctx.save();
    if (shakeX !== 0 || shakeY !== 0) {
      ctx.translate(shakeX, shakeY);
    }

    // 1. Draw Sunset Sky & Parallax Coastal Mountains
    ctx.drawImage(Sprites.sky, 0, 0);

    var parallaxOffset = Math.floor((baseSeg.Index || baseSegIdx) * 2.5 + camX * 0.04) % WIDTH;
    if (parallaxOffset < 0) parallaxOffset += WIDTH;
    ctx.drawImage(Sprites.mountains, -parallaxOffset, 215);
    ctx.drawImage(Sprites.mountains, WIDTH - parallaxOffset, 215);

    // Fill ground base below horizon
    ctx.fillStyle = lvl.colors.sandDark;
    ctx.fillRect(0, 365, WIDTH, HEIGHT - 365);

    // 2. Project & Render Road Segments Front-to-Back (with horizon clipping)
    var maxY = HEIGHT;
    var x = 0;
    var dx = -(baseSeg.curve * basePercent);

    for (var n = 0; n < lvl.drawDistance; n++) {
      var seg = segments[(baseSegIdx + n) % segments.length];
      var projCamZ = camZ;
      if (seg.index < baseSegIdx) {
        projCamZ -= trackLength;
      }

      // Project near and far edges of segment
      var z1 = seg.z - projCamZ;
      var z2 = (seg.z + segLen) - projCamZ;
      if (z1 <= 10) z1 = 10;
      if (z2 <= 10) continue;

      var scale1 = camDepth / z1;
      var scale2 = camDepth / z2;

      var sx1 = Math.floor(WIDTH * 0.5 + (scale1 * (x - camX)) * WIDTH * 0.5);
      var sy1 = Math.floor(HEIGHT * 0.5 - (scale1 * (seg.y - camY)) * HEIGHT * 0.5);
      var sw1 = Math.floor(scale1 * lvl.roadWidth * WIDTH * 0.5);

      var sx2 = Math.floor(WIDTH * 0.5 + (scale2 * (x + dx - camX)) * WIDTH * 0.5);
      var sy2 = Math.floor(HEIGHT * 0.5 - (scale2 * (seg.nextY - camY)) * HEIGHT * 0.5);
      var sw2 = Math.floor(scale2 * lvl.roadWidth * WIDTH * 0.5);

      // Save projection for sprite pass
      seg.projX = sx1;
      seg.projY = sy1;
      seg.projW = sw1;
      seg.projScale = scale1;
      seg.clipY = maxY;

      x += dx;
      dx += seg.curve;

      if (sy1 <= sy2 || sy2 >= maxY) {
        continue;
      }

      var isLight = Math.floor(seg.index / 3) % 2 === 0;

      // Coastal Ocean Water on Left / Sand & Cliffs on Right
      ctx.fillStyle = isLight ? lvl.colors.waterLight : lvl.colors.waterDark;
      ctx.fillRect(0, sy2, sx2 - sw2, sy1 - sy2);

      ctx.fillStyle = isLight ? lvl.colors.sandLight : lvl.colors.sandDark;
      ctx.fillRect(sx2 - sw2 * 1.4, sy2, WIDTH - (sx2 - sw2 * 1.4), sy1 - sy2);

      // Rumble strips
      var r1 = sw1 * 1.16;
      var r2 = sw2 * 1.16;
      drawQuad(sx1 - r1, sy1, sx1 + r1, sy1, sx2 + r2, sy2, sx2 - r2, sy2, isLight ? lvl.colors.rumbleLight : lvl.colors.rumbleDark);

      // Asphalt road surface
      drawQuad(sx1 - sw1, sy1, sx1 + sw1, sy1, sx2 + sw2, sy2, sx2 - sw2, sy2, isLight ? lvl.colors.roadLight : lvl.colors.roadDark);

      // Finish or Checkpoint checkerboard strip on road
      if (seg.isCheckpoint || seg.isFinish) {
        drawQuad(sx1 - sw1, sy1, sx1 + sw1, sy1, sx2 + sw2, sy2, sx2 - sw2, sy2, seg.isFinish ? "#ffbe18" : "#48dbfb");
      } else if (isLight) {
        // Dashed lane markers
        var lw1 = Math.max(2, sw1 * 0.035);
        var lw2 = Math.max(1, sw2 * 0.035);
        var lane1X1 = sx1 - sw1 * 0.33;
        var lane1X2 = sx2 - sw2 * 0.33;
        var lane2X1 = sx1 + sw1 * 0.33;
        var lane2X2 = sx2 + sw2 * 0.33;
        drawQuad(lane1X1 - lw1, sy1, lane1X1 + lw1, sy1, lane1X2 + lw2, sy2, lane1X2 - lw2, sy2, lvl.colors.laneLight);
        drawQuad(lane2X1 - lw1, sy1, lane2X1 + lw1, sy1, lane2X2 + lw2, sy2, lane2X2 - lw2, sy2, lvl.colors.laneLight);
      }

      maxY = sy2;
    }

    // 3. Render Roadside Objects, Checkpoint Arches, Traffic & Rivals Back-to-Front
    for (var b = lvl.drawDistance - 1; b >= 1; b--) {
      var bSeg = segments[(baseSegIdx + b) % segments.length];
      if (bSeg.projScale <= 0) continue;

      // Overhead Checkpoint / Finish Gantry Arch
      if (bSeg.isCheckpoint || bSeg.isFinish) {
        drawOverheadArch3D(bSeg, bSeg.isFinish);
      }

      // Roadside Props
      for (var s = 0; s < bSeg.sprites.length; s++) {
        var sp = bSeg.sprites[s];
        var spriteX = bSeg.projX + bSeg.projW * sp.offset;
        var spriteY = bSeg.projY;
        drawRoadsideProp3D(sp.type, spriteX, spriteY, bSeg.projW, bSeg.clipY);
      }

      // Traffic cars on this segment
      for (var tc = 0; tc < traffic.length; tc++) {
        var tr = traffic[tc];
        var trSegIdx = Math.floor(tr.z / segLen) % segments.length;
        if (trSegIdx === bSeg.index) {
          drawVehicle3D(tr.sprite, bSeg, tr.x, false);
        }
      }

      // Rival AI cars on this segment
      for (var rc = 0; rc < rivals.length; rc++) {
        var rv = rivals[rc];
        var rvSegIdx = Math.floor(rv.z / segLen) % segments.length;
        if (rvSegIdx === bSeg.index) {
          drawVehicle3D(rv.sprite, bSeg, rv.x, true, rv.name);
        }
      }

      // During Intro Flyover, also draw Player Car on starting grid
      if (gameState === STATE_INTRO && introPhase === 0) {
        var pSegIdx = Math.floor(player.z / segLen) % segments.length;
        if (pSegIdx === bSeg.index) {
          drawVehicle3D(Sprites.playerCar, bSeg, player.x, true, "YOU");
        }
      }
    }

    // 4. Atmospheric Sun Rays & Headlight Cone
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    // Diagonal sunset light ray
    ctx.fillStyle = "rgba(255, 185, 80, 0.055)";
    ctx.beginPath();
    ctx.moveTo(310, 240);
    ctx.lineTo(460, 240);
    ctx.lineTo(860, HEIGHT);
    ctx.lineTo(120, HEIGHT);
    ctx.closePath();
    ctx.fill();

    // Player Car Headlight Beams on Road
    if (gameState !== STATE_INTRO || introPhase === 1) {
      ctx.fillStyle = "rgba(255, 245, 195, 0.09)";
      ctx.beginPath();
      ctx.moveTo(WIDTH * 0.5 - 50, HEIGHT - 82);
      ctx.lineTo(WIDTH * 0.5 - 240, HEIGHT - 230);
      ctx.lineTo(WIDTH * 0.5 + 240, HEIGHT - 230);
      ctx.lineTo(WIDTH * 0.5 + 50, HEIGHT - 82);
      ctx.closePath();
      ctx.fill();
    }

    // Nitro Speed Streaks at Screen Edges
    if (player.isBoosting) {
      ctx.strokeStyle = "rgba(72, 219, 251, 0.45)";
      ctx.lineWidth = 3;
      for (var ns = 0; ns < 12; ns++) {
        var ang = (ns / 12) * Math.PI * 2 + totalRaceTime * 5;
        var rx1 = WIDTH * 0.5 + Math.cos(ang) * 340;
        var ry1 = HEIGHT * 0.55 + Math.sin(ang) * 190;
        var rx2 = WIDTH * 0.5 + Math.cos(ang) * 660;
        var ry2 = HEIGHT * 0.55 + Math.sin(ang) * 380;
        ctx.beginPath();
        ctx.moveTo(rx1, ry1);
        ctx.lineTo(rx2, ry2);
        ctx.stroke();
      }
    }
    ctx.restore();

    // 5. Render Player Car (unless in Intro Flyover)
    if (gameState !== STATE_INTRO || introPhase === 1) {
      drawPlayerCar3D();
    }

    // 6. Render Particles (Smoke, Sand Dust, Crash Sparks, Nitro Flames)
    renderParticles();

    ctx.restore();
  }

  function drawQuad(x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
  }

  function drawRoadsideProp3D(type, x, y, roadW, clipY) {
    if (y <= 150 || x < -300 || x > WIDTH + 300) return;
    var img = null;
    var scaleW = 0, scaleH = 0;

    if (type === "palm") {
      img = Sprites.palmTree;
      scaleW = roadW * 0.65;
      scaleH = scaleW * 1.44;
    } else if (type === "boulder") {
      img = Sprites.boulder;
      scaleW = roadW * 0.55;
      scaleH = scaleW * 0.68;
    } else if (type === "lamp") {
      img = Sprites.streetLamp;
      scaleW = roadW * 0.42;
      scaleH = scaleW * 2.33;
    } else if (type === "sign") {
      img = Sprites.signChevron;
      scaleW = roadW * 0.25;
      scaleH = scaleW * 1.44;
    } else if (type === "billboard") {
      img = Sprites.billboard;
      scaleW = roadW * 0.72;
      scaleH = scaleW * 0.68;
    }

    if (!img || scaleW < 4) return;
    var destX = x - scaleW * 0.5;
    var destY = y - scaleH;
    var clipH = Math.max(0, y - clipY);
    if (clipH >= scaleH) return;

    var srcH = img.height * (1 - clipH / scaleH);
    ctx.drawImage(img, 0, 0, img.width, srcH, destX, destY, scaleW, scaleH - clipH);
  }

  function drawOverheadArch3D(seg, isFinish) {
    var x = seg.projX;
    var y = seg.projY;
    var w = seg.projW * 1.15;
    var h = seg.projW * 0.68;
    if (w < 12 || y > seg.clipY + 20) return;

    // Pillars
    ctx.fillStyle = "#1e272e";
    var pw = Math.max(4, w * 0.08);
    ctx.fillRect(x - w, y - h, pw, h);
    ctx.fillRect(x + w - pw, y - h, pw, h);

    // Overhead Banner
    var bh = Math.max(8, h * 0.26);
    ctx.fillStyle = isFinish ? "#ff3838" : "#0abde3";
    ctx.fillRect(x - w, y - h, w * 2, bh);

    if (w > 90) {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold " + Math.floor(bh * 0.65) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(isFinish ? "FINISH LINE" : "CHECKPOINT", x, y - h + bh * 0.74);
    }
  }

  function drawVehicle3D(sprite, seg, offset, isRival, label) {
    var x = seg.projX + seg.projW * offset;
    var y = seg.projY;
    var carW = seg.projW * 0.40;
    var carH = carW * (sprite.height / sprite.width);
    if (carW < 6) return;

    var destX = x - carW * 0.5;
    var destY = y - carH;
    var clipH = Math.max(0, y - seg.clipY);
    if (clipH >= carH) return;

    var srcH = sprite.height * (1 - clipH / carH);
    ctx.drawImage(sprite, 0, 0, sprite.width, srcH, destX, destY, carW, carH - clipH);

    // Rival name tag above car when close
    if (isRival && label && carW > 38 && destY > 180) {
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(x - 32, destY - 22, 64, 18);
      ctx.fillStyle = "#ffcb5c";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, destY - 8);
    }
  }

  function drawPlayerCar3D() {
    var carW = 248;
    var carH = 148;
    var cx = WIDTH * 0.5;
    var cy = HEIGHT - 96 + (player.speed > 500 ? Math.sin(totalRaceTime * 28) * 1.8 : 0);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.driftAngle * 0.14);

    // Nitro dual blue exhaust flames
    if (player.isBoosting) {
      ctx.drawImage(Sprites.glowCyan, -85, -10, 95, 95);
      ctx.drawImage(Sprites.glowCyan, -10, -10, 95, 95);
    } else if (keys.down) {
      // Bright brake light glow
      ctx.drawImage(Sprites.glowWarm, -105, -28, 80, 80);
      ctx.drawImage(Sprites.glowWarm, 25, -28, 80, 80);
    }

    ctx.drawImage(Sprites.playerCar, -carW * 0.5, -carH * 0.5, carW, carH);
    ctx.restore();
  }

  // ============================================================================
  // 12. RENDERING: TOP-DOWN CAMERA VIEW (Same Game State!)
  // ============================================================================
  function renderTopDown() {
    var lvl = currentLevel;
    var segLen = lvl.segmentLength;
    var camZ = (gameState === STATE_INTRO && introPhase === 0) ? introCamZ : player.z;
    var baseSegIdx = Math.floor(camZ / segLen) % segments.length;
    var basePercent = (camZ % segLen) / segLen;

    // Background Coastal Water (left) and Sandy Cliff (right)
    ctx.fillStyle = lvl.colors.waterDark;
    ctx.fillRect(0, 0, WIDTH * 0.45, HEIGHT);
    ctx.fillStyle = lvl.colors.sandDark;
    ctx.fillRect(WIDTH * 0.35, 0, WIDTH * 0.65, HEIGHT);

    // Compute road spine coordinates going up the screen
    var numVis = 48;
    var stepY = 16;
    var originY = HEIGHT - 135 + basePercent * stepY;
    var spine = [];
    var curX = WIDTH * 0.5 - player.x * 165;
    var curHeading = 0;

    for (var i = -8; i < numVis; i++) {
      var sIdx = (baseSegIdx + i + segments.length) % segments.length;
      var seg = segments[sIdx];
      if (i >= 0) {
        curHeading += seg.curve * 0.011;
        curX += Math.sin(curHeading) * 18;
      } else {
        curX -= Math.sin(curHeading) * 18;
      }
      var sy = originY - i * stepY;
      spine.push({
        seg: seg,
        x: curX,
        y: sy,
        angle: curHeading
      });
    }

    var roadHalfW = 195;

    // Draw Road Segments in Top-Down
    for (var k = 0; k < spine.length - 1; k++) {
      var p1 = spine[k];
      var p2 = spine[k + 1];
      var isLight = Math.floor(p1.seg.index / 3) % 2 === 0;

      // Beach shoreline strip on left
      drawQuad(
        0, p1.y, p1.x - roadHalfW * 1.15, p1.y,
        p2.x - roadHalfW * 1.15, p2.y, 0, p2.y,
        isLight ? lvl.colors.waterLight : lvl.colors.waterDark
      );

      // Rumble strips
      drawQuad(
        p1.x - roadHalfW * 1.14, p1.y, p1.x + roadHalfW * 1.14, p1.y,
        p2.x + roadHalfW * 1.14, p2.y, p2.x - roadHalfW * 1.14, p2.y,
        isLight ? lvl.colors.rumbleLight : lvl.colors.rumbleDark
      );

      // Asphalt
      var roadCol = isLight ? lvl.colors.roadLight : lvl.colors.roadDark;
      if (p1.seg.isFinish) roadCol = "#ffbe18";
      else if (p1.seg.isCheckpoint) roadCol = "#48dbfb";

      drawQuad(
        p1.x - roadHalfW, p1.y, p1.x + roadHalfW, p1.y,
        p2.x + roadHalfW, p2.y, p2.x - roadHalfW, p2.y,
        roadCol
      );

      // Lane Dividers
      if (isLight && !p1.seg.isCheckpoint && !p1.seg.isFinish) {
        var l1a = p1.x - roadHalfW * 0.33, l1b = p2.x - roadHalfW * 0.33;
        var l2a = p1.x + roadHalfW * 0.33, l2b = p2.x + roadHalfW * 0.33;
        drawQuad(l1a - 3, p1.y, l1a + 3, p1.y, l1b + 3, p2.y, l1b - 3, p2.y, lvl.colors.laneLight);
        drawQuad(l2a - 3, p1.y, l2a + 3, p1.y, l2b + 3, p2.y, l2b - 3, p2.y, lvl.colors.laneLight);
      }

      // Top-down roadside palm canopies & rocks
      for (var sp = 0; sp < p1.seg.sprites.length; sp++) {
        var prop = p1.seg.sprites[sp];
        var px = p1.x + prop.offset * roadHalfW;
        if (prop.type === "palm") {
          ctx.fillStyle = "#1b3b2b";
          ctx.beginPath();
          ctx.arc(px, p1.y, 18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#2d5a40";
          ctx.beginPath();
          ctx.arc(px + 3, p1.y - 3, 11, 0, Math.PI * 2);
          ctx.fill();
        } else if (prop.type === "boulder") {
          ctx.fillStyle = "#5c3842";
          ctx.fillRect(px - 14, p1.y - 10, 28, 20);
        } else if (prop.type === "lamp") {
          ctx.drawImage(Sprites.glowWarm, px - 28, p1.y - 28, 56, 56);
        }
      }
    }

    // Helper to convert world (z, x) to Top-Down screen coordinates
    function worldToTopDown(wz, wx) {
      var relSeg = (wz - camZ) / segLen;
      var idx = Math.floor(relSeg) + 8;
      if (idx < 0 || idx >= spine.length - 1) return null;
      var frac = relSeg - Math.floor(relSeg);
      var sA = spine[idx];
      var sB = spine[idx + 1];
      var sx = sA.x + (sB.x - sA.x) * frac + wx * roadHalfW;
      var sy = sA.y + (sB.y - sA.y) * frac;
      var ang = sA.angle + (sB.angle - sA.angle) * frac;
      return { x: sx, y: sy, angle: ang };
    }

    // Draw Traffic Cars in Top-Down
    for (var t = 0; t < traffic.length; t++) {
      var tr = traffic[t];
      var tPos = worldToTopDown(tr.z, tr.x);
      if (tPos) {
        drawTopDownCar(tPos.x, tPos.y, tPos.angle, "#dfe6e9", "#2d3436", null, false);
      }
    }

    // Draw Rival Cars in Top-Down
    var rivalColors = ["#0abde3", "#10ac84", "#8854d0", "#f39c12", "#c8d6e5"];
    for (var r = 0; r < rivals.length; r++) {
      var rv = rivals[r];
      var rPos = worldToTopDown(rv.z, rv.x);
      if (rPos) {
        drawTopDownCar(rPos.x, rPos.y, rPos.angle, rivalColors[r % rivalColors.length], "#ffffff", rv.name, false);
      }
    }

    // Draw Player Car in Top-Down
    var pPos = worldToTopDown(player.z, player.x);
    if (pPos) {
      drawTopDownCar(pPos.x, pPos.y, pPos.angle + player.driftAngle * 0.32, "#e62e2d", "#ffcb5c", "YOU", player.isBoosting);
    }

    renderParticles();
  }

  function drawTopDownCar(x, y, angle, color, stripeColor, label, isBoosting) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // Headlight beams
    ctx.fillStyle = "rgba(255, 245, 190, 0.16)";
    ctx.beginPath();
    ctx.moveTo(-12, -26);
    ctx.lineTo(-34, -110);
    ctx.lineTo(34, -110);
    ctx.lineTo(12, -26);
    ctx.closePath();
    ctx.fill();

    // Nitro flame
    if (isBoosting) {
      ctx.drawImage(Sprites.glowCyan, -32, 10, 64, 64);
    }

    // Car shadow & chassis
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(-17, -25, 38, 54);

    ctx.fillStyle = color;
    ctx.fillRect(-16, -26, 32, 52);

    ctx.fillStyle = stripeColor;
    ctx.fillRect(-4, -26, 8, 52);

    // Windshield
    ctx.fillStyle = "#1e272e";
    ctx.fillRect(-12, -12, 24, 18);

    ctx.restore();

    if (label) {
      ctx.fillStyle = "#ffcb5c";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - 34);
    }
  }

  function renderParticles() {
    for (var i = 0; i < MAX_PARTICLES; i++) {
      var p = particles[i];
      if (!p.active) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      if (p.type === 2) {
        // Sparks
        ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
      } else {
        // Smoke / Dust / Flame circle
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ============================================================================
  // 13. FULL SOFA-READABLE HUD & CINEMATIC INTRO OVERLAYS
  // ============================================================================
  function renderHUD() {
    var segLen = currentLevel.segmentLength;
    var finishZ = checkpointSegments[checkpointSegments.length - 1] * segLen;
    var progressPct = Math.min(100, Math.max(0, Math.floor((player.z / finishZ) * 100)));

    // 1. TOP-LEFT: MINIMAP (Track Shape + Rivals + Player) & BEST TIME
    var mmX = 24;
    var mmY = 22;
    ctx.drawImage(minimapCanvas, mmX, mmY);

    // Draw Rival dots on Minimap
    var rivalCols = ["#0abde3", "#10ac84", "#8854d0", "#f39c12", "#c8d6e5"];
    for (var r = 0; r < rivals.length; r++) {
      var rIdx = Math.min(minimapPoints.length - 1, Math.max(0, Math.floor(rivals[r].z / segLen)));
      var rPt = minimapPoints[rIdx];
      ctx.fillStyle = rivalCols[r % rivalCols.length];
      ctx.beginPath();
      ctx.arc(mmX + rPt.sx, mmY + rPt.sy, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw Player dot on Minimap
    var pIdx = Math.min(minimapPoints.length - 1, Math.max(0, Math.floor(player.z / segLen)));
    var pPt = minimapPoints[pIdx];
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(mmX + pPt.sx, mmY + pPt.sy, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff2e2e";
    ctx.beginPath();
    ctx.arc(mmX + pPt.sx, mmY + pPt.sy, 4.5, 0, Math.PI * 2);
    ctx.fill();

    // Best Time Badge below Minimap
    ctx.fillStyle = "rgba(10, 14, 26, 0.80)";
    ctx.fillRect(mmX, mmY + 166, 200, 38);
    ctx.strokeStyle = "rgba(255, 180, 70, 0.45)";
    ctx.strokeRect(mmX, mmY + 166, 200, 38);
    ctx.fillStyle = "#ffcb5c";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "left";
    var btStr = settings.bestTime !== null ? formatTime(settings.bestTime) : "--:--.--";
    ctx.fillText("BEST: " + btStr, mmX + 12, mmY + 191);

    // 2. TOP-CENTER: TIME REMAINING & NEXT CHECKPOINT DISTANCE
    var tcX = WIDTH * 0.5;
    ctx.fillStyle = "rgba(10, 14, 26, 0.84)";
    ctx.fillRect(tcX - 165, 18, 330, 108);
    ctx.strokeStyle = raceTimeLeft < 10 ? "#ff3838" : "rgba(255, 200, 90, 0.55)";
    ctx.lineWidth = 3;
    ctx.strokeRect(tcX - 165, 18, 330, 108);

    ctx.fillStyle = "#dcdde1";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("TIME REMAINING", tcX, 40);

    var timeWarning = (raceTimeLeft < 10 && Math.floor(totalRaceTime * 6) % 2 === 0);
    ctx.fillStyle = timeWarning ? "#ff3838" : "#fffa65";
    ctx.font = "bold 52px sans-serif";
    ctx.fillText(raceTimeLeft.toFixed(1) + "s", tcX, 90);

    // Distance to Next Checkpoint
    var nextCpZ = checkpointSegments[Math.min(checkpointSegments.length - 1, nextCheckpointIdx)] * segLen;
    var distMeters = Math.max(0, Math.floor((nextCpZ - player.z) * 0.05));
    var cpLabel = (nextCheckpointIdx === checkpointSegments.length - 1) ? "FINISH LINE IN " : "NEXT CHECKPOINT: ";
    ctx.fillStyle = "#48dbfb";
    ctx.font = "bold 17px sans-serif";
    ctx.fillText(cpLabel + distMeters + " m  (" + (nextCheckpointIdx + 1) + "/" + checkpointSegments.length + ")", tcX, 116);

    // 3. TOP-RIGHT: RACE POSITION & STAGE PROGRESS BAR
    var trX = WIDTH - 264;
    ctx.fillStyle = "rgba(10, 14, 26, 0.84)";
    ctx.fillRect(trX, 22, 240, 115);
    ctx.strokeStyle = "rgba(255, 180, 70, 0.45)";
    ctx.lineWidth = 2;
    ctx.strokeRect(trX, 22, 240, 115);

    ctx.fillStyle = "#dcdde1";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("POSITION", trX + 18, 52);

    ctx.fillStyle = playerPosition === 1 ? "#fffa65" : "#ffffff";
    ctx.font = "bold 46px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(playerPosition + "/6", trX + 224, 64);

    // Progress Bar
    ctx.fillStyle = "#dcdde1";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("STAGE PROGRESS: " + progressPct + "%", trX + 18, 94);

    ctx.fillStyle = "#2f3640";
    ctx.fillRect(trX + 18, 104, 204, 16);
    ctx.fillStyle = "#ff9f43";
    ctx.fillRect(trX + 18, 104, (204 * progressPct) / 100, 16);

    // 4. BOTTOM-RIGHT: SPEEDOMETER, GEAR, RPM BAR & NITRO BAR
    var brX = WIDTH - 355;
    var brY = HEIGHT - 158;
    ctx.fillStyle = "rgba(10, 14, 26, 0.86)";
    ctx.fillRect(brX, brY, 330, 138);
    ctx.strokeStyle = player.isBoosting ? "#48dbfb" : "rgba(255, 180, 70, 0.5)";
    ctx.lineWidth = 3;
    ctx.strokeRect(brX, brY, 330, 138);

    // Digital Speed (KM/H)
    var kmh = Math.floor(Math.abs(player.speed) * 0.0235);
    ctx.fillStyle = player.isBoosting ? "#48dbfb" : "#ffffff";
    ctx.font = "bold 56px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(kmh, brX + 170, brY + 62);

    ctx.fillStyle = "#ffcb5c";
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("KM/H", brX + 178, brY + 58);

    // Gear Indicator Badge
    ctx.fillStyle = "#222f3e";
    ctx.fillRect(brX + 245, brY + 14, 68, 56);
    ctx.strokeStyle = "#ff9f43";
    ctx.lineWidth = 2;
    ctx.strokeRect(brX + 245, brY + 14, 68, 56);

    var gearStr = player.gear === -1 ? "R" : (player.gear === 0 ? "N" : String(player.gear));
    ctx.fillStyle = "#fffa65";
    ctx.font = "bold 38px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(gearStr, brX + 279, brY + 55);

    // RPM Bar
    var rpmNorm = Math.max(0, Math.min(1, (player.rpm - 1000) / 7000));
    ctx.fillStyle = "#dcdde1";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("RPM", brX + 16, brY + 92);

    ctx.fillStyle = "#2f3640";
    ctx.fillRect(brX + 72, brY + 78, 240, 16);
    var rpmColor = rpmNorm > 0.85 ? "#ff3838" : (rpmNorm > 0.6 ? "#ffbe18" : "#2ed573");
    ctx.fillStyle = rpmColor;
    ctx.fillRect(brX + 72, brY + 78, 240 * rpmNorm, 16);

    // NITRO Bar
    ctx.fillStyle = "#48dbfb";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("NITRO", brX + 16, brY + 120);

    ctx.fillStyle = "#2f3640";
    ctx.fillRect(brX + 72, brY + 106, 240, 18);
    ctx.fillStyle = player.isBoosting ? "#ffffff" : "#00d2d3";
    ctx.fillRect(brX + 72, brY + 106, 240 * (player.nitro / 100), 18);

    ctx.fillStyle = "#0a0e1a";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(player.isBoosting ? "BOOSTING!" : "PRESS OK FOR NITRO", brX + 192, brY + 120);

    // 5. DRIFT / NEAR-MISS / CHECKPOINT POPUP BANNER
    if (hudPopupTimer > 0) {
      ctx.fillStyle = "rgba(10, 14, 26, 0.85)";
      ctx.fillRect(tcX - 240, 140, 480, 44);
      ctx.strokeStyle = hudPopupColor;
      ctx.lineWidth = 2;
      ctx.strokeRect(tcX - 240, 140, 480, 44);
      ctx.fillStyle = hudPopupColor;
      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(hudPopupText, tcX, 170);
    } else if (player.isDrifting) {
      ctx.fillStyle = "rgba(10, 14, 26, 0.82)";
      ctx.fillRect(tcX - 150, 140, 300, 40);
      ctx.fillStyle = "#ff9f43";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("DRIFTING! +NITRO CHARGE", tcX, 167);
    }
  }

  function renderIntroOverlay() {
    // Letterbox cinema bars
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, WIDTH, 92);
    ctx.fillRect(0, HEIGHT - 92, WIDTH, 92);

    if (introPhase === 0) {
      // Fade in/out Stage Title
      var alpha = 1.0;
      if (introTimer < 0.8) alpha = introTimer / 0.8;
      else if (introTimer > 4.2) alpha = Math.max(0, (5.2 - introTimer) / 1.0);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "rgba(10, 14, 26, 0.78)";
      ctx.fillRect(WIDTH * 0.5 - 390, HEIGHT * 0.5 - 85, 780, 150);
      ctx.strokeStyle = "#ffcb5c";
      ctx.lineWidth = 3;
      ctx.strokeRect(WIDTH * 0.5 - 390, HEIGHT * 0.5 - 85, 780, 150);

      ctx.fillStyle = "#ffcb5c";
      ctx.font = "bold 40px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(currentLevel.name, WIDTH * 0.5, HEIGHT * 0.5 - 18);

      ctx.fillStyle = "#48dbfb";
      ctx.font = "bold 22px sans-serif";
      ctx.fillText(currentLevel.subtitle, WIDTH * 0.5, HEIGHT * 0.5 + 32);
      ctx.restore();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("PRESS [OK] TO SKIP INTRO", WIDTH - 40, HEIGHT - 36);
    } else {
      // 3 - 2 - 1 - GO Countdown
      var rem = 3.5 - introTimer;
      var num = Math.ceil(rem);
      var text = num > 0 ? String(num) : "GO!";
      var col = num > 0 ? "#ffcb5c" : "#2ed573";

      ctx.fillStyle = "rgba(10, 14, 26, 0.82)";
      ctx.fillRect(WIDTH * 0.5 - 160, HEIGHT * 0.5 - 95, 320, 160);
      ctx.strokeStyle = col;
      ctx.lineWidth = 4;
      ctx.strokeRect(WIDTH * 0.5 - 160, HEIGHT * 0.5 - 95, 320, 160);

      ctx.fillStyle = col;
      ctx.font = "bold 104px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, WIDTH * 0.5, HEIGHT * 0.5 + 22);
    }
  }

  // ============================================================================
  // 14. MENU & SPLASH SCREEN RENDERERS
  // ============================================================================
  function renderSplashScreen(timeSec) {
    ctx.drawImage(Sprites.sky, 0, 0, WIDTH, HEIGHT * 0.65);
    ctx.drawImage(Sprites.mountains, 0, HEIGHT * 0.45, WIDTH, 200);
    ctx.fillStyle = "#191326";
    ctx.fillRect(0, HEIGHT * 0.65, WIDTH, HEIGHT * 0.35);

    // Central Card
    var bx = WIDTH * 0.5 - 430;
    var by = 85;
    var bw = 860;
    var bh = 550;
    ctx.fillStyle = "rgba(12, 16, 30, 0.92)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#ff9f43";
    ctx.lineWidth = 4;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.fillStyle = "#ffcb5c";
    ctx.font = "bold 62px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("SUNSET COAST TURBO", WIDTH * 0.5, by + 95);

    ctx.fillStyle = "#48dbfb";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("SMART TV EDITION • STAGE 1 TEST BUILD", WIDTH * 0.5, by + 140);

    // Remote Controls Guide Box
    ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
    ctx.fillRect(bx + 70, by + 175, bw - 140, 235);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText("TV REMOTE CONTROLS", WIDTH * 0.5, by + 215);

    ctx.font = "bold 21px sans-serif";
    ctx.fillStyle = "#dcdde1";
    ctx.fillText("UP ARROW : Accelerate (Auto-Gearbox + Cruise Assist)", WIDTH * 0.5, by + 258);
    ctx.fillText("LEFT / RIGHT ARROWS : Steer & High-Speed Drift", WIDTH * 0.5, by + 294);
    ctx.fillText("DOWN ARROW : Brake / Reverse", WIDTH * 0.5, by + 330);
    ctx.fillText("OK / ENTER BUTTON : Activate Nitro Boost", WIDTH * 0.5, by + 366);
    ctx.fillText("RETURN / BACK : Pause & Switch Camera View", WIDTH * 0.5, by + 400);

    // Pulsing Press OK Prompt
    if (Math.floor(timeSec * 2.5) % 2 === 0) {
      ctx.fillStyle = "#2ed573";
      ctx.font = "bold 36px sans-serif";
      ctx.fillText("PRESS [OK] ON REMOTE TO START", WIDTH * 0.5, by + 490);
    }
  }

  function formatOptionLabel(label) {
    if (label === "CAMERA VIEW") {
      return "CAMERA VIEW : " + (settings.cameraView === CAM_CHASE ? "BEHIND CAR (3D)" : "TOP-DOWN");
    }
    if (label === "SOUND") {
      return "SOUND : " + (settings.soundEnabled ? "ON" : "OFF");
    }
    return label;
  }

  function renderModalMenu(title, subtitle, items) {
    ctx.fillStyle = "rgba(5, 8, 18, 0.78)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    var mw = 680;
    var mh = 190 + items.length * 72;
    var mx = (WIDTH - mw) * 0.5;
    var my = (HEIGHT - mh) * 0.5;

    ctx.fillStyle = "rgba(16, 22, 40, 0.96)";
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = "#ffcb5c";
    ctx.lineWidth = 4;
    ctx.strokeRect(mx, my, mw, mh);

    ctx.fillStyle = "#ffcb5c";
    ctx.font = "bold 46px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(title, WIDTH * 0.5, my + 68);

    ctx.fillStyle = "#48dbfb";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText(subtitle, WIDTH * 0.5, my + 105);

    for (var i = 0; i < items.length; i++) {
      var iy = my + 135 + i * 70;
      var isSelected = (i === menuCursor);

      ctx.fillStyle = isSelected ? "#ff9f43" : "rgba(255, 255, 255, 0.08)";
      ctx.fillRect(mx + 60, iy, mw - 120, 54);
      if (isSelected) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(mx + 60, iy, mw - 120, 54);
      }

      ctx.fillStyle = isSelected ? "#0a0e1a" : "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText(formatOptionLabel(items[i].label), WIDTH * 0.5, iy + 36);
    }

    ctx.fillStyle = "#a4b0be";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText("Navigate: UP / DOWN   •   Select: OK", WIDTH * 0.5, my + mh - 18);
  }

  function renderResultsScreen() {
    ctx.fillStyle = "rgba(5, 8, 18, 0.84)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    var mw = 740;
    var mh = 510;
    var mx = (WIDTH - mw) * 0.5;
    var my = (HEIGHT - mh) * 0.5;

    ctx.fillStyle = "rgba(16, 22, 40, 0.96)";
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = raceWon ? "#2ed573" : "#ff3838";
    ctx.lineWidth = 4;
    ctx.strokeRect(mx, my, mw, mh);

    ctx.fillStyle = raceWon ? "#2ed573" : "#ff3838";
    ctx.font = "bold 50px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(raceWon ? "STAGE 1 COMPLETE!" : "TIME EXPIRED!", WIDTH * 0.5, my + 75);

    var ordinals = ["1ST", "2ND", "3RD", "4TH", "5TH", "6TH"];
    var posText = ordinals[Math.max(0, Math.min(5, playerPosition - 1))] + " PLACE  (" + playerPosition + " / 6)";

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 32px sans-serif";
    ctx.fillText("FINAL POSITION : " + posText, WIDTH * 0.5, my + 145);

    ctx.fillStyle = "#ffcb5c";
    ctx.font = "bold 30px sans-serif";
    ctx.fillText("RACE TIME : " + formatTime(totalRaceTime), WIDTH * 0.5, my + 198);

    var bestStr = settings.bestTime !== null ? formatTime(settings.bestTime) : "--:--.--";
    ctx.fillStyle = "#48dbfb";
    ctx.fillText("BEST TIME : " + bestStr + (newRecord ? "  (NEW RECORD!)" : ""), WIDTH * 0.5, my + 248);

    for (var i = 0; i < resultsMenuItems.length; i++) {
      var iy = my + 295 + i * 74;
      var isSelected = (i === menuCursor);

      ctx.fillStyle = isSelected ? "#ff9f43" : "rgba(255, 255, 255, 0.08)";
      ctx.fillRect(mx + 110, iy, mw - 220, 56);
      if (isSelected) {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(mx + 110, iy, mw - 220, 56);
      }

      ctx.fillStyle = isSelected ? "#0a0e1a" : "#ffffff";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText(resultsMenuItems[i].label, WIDTH * 0.5, iy + 37);
    }
  }

  function formatTime(sec) {
    var mins = Math.floor(sec / 60);
    var rem = sec % 60;
    var sStr = rem < 10 ? "0" + rem.toFixed(2) : rem.toFixed(2);
    return mins + ":" + sStr;
  }

  // ============================================================================
  // 15. MAIN DELTA-TIME GAME LOOP
  // ============================================================================
  buildTrack(currentLevel);
  var lastFrameTime = performance.now();

  function gameLoop(now) {
    var dt = (now - lastFrameTime) * 0.001;
    lastFrameTime = now;
    // Clamp delta-time to prevent physics jumps on tab switch or lag spike
    if (dt > 0.08) dt = 0.08;
    if (dt < 0.001) dt = 0.001;

    // Update Music
    if (gameState !== STATE_SPLASH) {
      AudioSys.updateMusic(dt, gameState === STATE_RACING || gameState === STATE_INTRO);
    }

    // Update Game State
    if (gameState === STATE_INTRO) {
      updateIntro(dt);
      updateParticles(dt);
    } else if (gameState === STATE_RACING) {
      updateRacing(dt);
      updateParticles(dt);
    }

    // Render Active Scene
    if (gameState === STATE_SPLASH) {
      renderSplashScreen(now * 0.001);
    } else if (gameState === STATE_MENU) {
      renderPseudo3D();
      renderModalMenu("SUNSET COAST TURBO", "STAGE 1: GOLDEN COAST HIGHWAY", mainMenuItems);
    } else if (gameState === STATE_INTRO) {
      if (settings.cameraView === CAM_TOPDOWN && introPhase === 1) {
        renderTopDown();
      } else {
        renderPseudo3D();
      }
      renderIntroOverlay();
    } else if (gameState === STATE_RACING) {
      if (settings.cameraView === CAM_TOPDOWN) {
        renderTopDown();
      } else {
        renderPseudo3D();
      }
      renderHUD();
    } else if (gameState === STATE_PAUSED) {
      if (settings.cameraView === CAM_TOPDOWN) {
        renderTopDown();
      } else {
        renderPseudo3D();
      }
      renderHUD();
      renderModalMenu("RACE PAUSED", "STAGE 1: SUNSET COAST HIGHWAY", pauseMenuItems);
    } else if (gameState === STATE_RESULTS) {
      if (settings.cameraView === CAM_TOPDOWN) {
        renderTopDown();
      } else {
        renderPseudo3D();
      }
      renderResultsScreen();
    }

    requestAnimationFrame(gameLoop);
  }

  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
