<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sunset Coast Turbo - TV Edition</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #05050a;
    overflow: hidden;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }
  #gameContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
</div>

<script>
(function() {
  "use strict";

  // ============================================================================
  // 1. CONSTANTS & CONFIGURATION
  // ============================================================================
  var WIDTH = 1280;
  var HEIGHT = 720;
  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext("2d", { alpha: false });

  // Game States
  var STATE_SPLASH = 0;
  var STATE_MENU = 1;
  var STATE_INTRO = 2;
  var STATE_RACING = 3;
  var STATE_PAUSED = 4;
  var STATE_RESULTS = 5;

  // Camera Views
  var CAM_CHASE = 0;
  var CAM_TOPDOWN = 1;

  // Key Codes (TV Remote + Keyboard fallback)
  var KEY_LEFT = 37;
  var KEY_UP = 38;
  var KEY_RIGHT = 39;
  var KEY_DOWN = 40;
  var KEY_OK = 13;
  var KEY_BACK_TIZEN = 10009;
  var KEY_BACKSPACE = 8;
  var KEY_ESCAPE = 27;

  // Register Tizen TV Remote Keys safely
  try {
    if (window.tizen && window.tizen.tvinputdevice) {
      var tizenKeys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter"];
      for (var tk = 0; tk < tizenKeys.length; tk++) {
        try {
          window.tizen.tvinputdevice.registerKey(tizenKeys[tk]);
        } catch (innerErr) {}
      }
    }
  } catch (err) {}

  // Responsive scaling for 32" TV screen
  function resizeCanvas() {
    var winW = window.innerWidth || WIDTH;
    var winH = window.innerHeight || HEIGHT;
    var scale = Math.min(winW / WIDTH, winH / HEIGHT);
    canvas.style.width = Math.floor(WIDTH * scale) + "px";
    canvas.style.height = Math.floor(HEIGHT * scale) + "px";
  }
  window.addEventListener("resize", resizeCanvas, false);
  resizeCanvas();

  // ============================================================================
  // 2. LEVEL DATA DEFINITIONS (Extensible architecture for future levels)
  // ============================================================================
  var LEVELS = [
    {
      id: 1,
      name: "STAGE 1: SUNSET COAST HIGHWAY",
      subtitle: "Golden Hour • Coastal Cliffs • Checkpoint Time Attack",
      environment: "coastal_sunset",
      timeOfDay: "sunset",
      weather: "clear_haze",
      segmentLength: 200,
      roadWidth: 2200,
      lanes: 3,
      drawDistance: 155,
      cameraHeight: 1050,
      fov: 100,
      startTimeLimit: 40.0,
      checkpointBonus: 26.0,
      checkpointCount: 5,
      rivalCount: 5,
      trafficCount: 38,
      difficulty: 1.0,
      colors: {
        skyTop: "#140c2c",
        skyMid: "#5e1c47",
        skyBot: "#f26b38",
        horizonGlow: "#ffcc55",
        waterDark: "#1c244b",
        waterLight: "#e86f38",
        roadLight: "#464952",
        roadDark: "#3e4149",
        rumbleLight: "#e03c28",
        rumbleDark: "#f2f2f2",
        laneLight: "#ffd27d",
        sandLight: "#8a5a44",
        sandDark: "#784c38"
      },
      // Track blueprint: [enter, hold, exit, curve, hillHeight]
      // Total length tuned for ~2 to 2.5 minutes of racing (~6400 segments)
      trackBlueprint: [
        [0, 80, 0, 0, 0],            // Starting straight
        [30, 90, 30, -2.2, 15],      // Sweeping left along beach
        [25, 60, 25, 0, -10],        // Dip down
        [35, 110, 35, 3.0, 25],      // Climbing right cliff curve
        [20, 70, 20, -1.8, 0],       // Fast coastal S-bend 1
        [20, 70, 20, 2.2, -20],      // Fast coastal S-bend 2
        [30, 120, 30, 0, 35],        // Long scenic hill climb
        [30, 100, 30, -3.5, -30],    // Sharp downhill left turn
        [25, 90, 25, 1.5, 0],        // Gentle right
        [40, 140, 40, -2.6, 20],     // Wide ocean bay curve
        [20, 80, 20, 0, -15],        // Straight valley
        [35, 110, 35, 3.8, 10],      // Tight headland right
        [25, 75, 25, -2.5, 25],      // Left climb
        [25, 75, 25, 2.5, -25],      // Right descent
        [30, 130, 30, 0, 0],         // High speed straightaway
        [40, 130, 40, -3.2, 30],     // Grand coastal overlook left
        [30, 95, 30, 2.8, -20],      // Winding descent right
        [25, 85, 25, -2.8, -10],     // Winding descent left
        [30, 110, 30, 1.8, 15],      // Medium right roller
        [35, 120, 35, -3.8, 0],      // Challenging hairpin-style left
        [25, 90, 25, 2.0, 25],       // Uphill recovery right
        [30, 100, 30, -1.5, -25],    // Downhill sprint
        [35, 110, 35, 3.4, 15],      // Final canyon right
        [30, 90, 30, -2.4, -15],     // Final bay sweep left
        [25, 140, 25, 0, 0]          // Finish line straight
      ]
    }
  ];

  // ============================================================================
  // 3. PERSISTENT SETTINGS & STORAGE
  // ============================================================================
  var settings = {
    cameraView: CAM_CHASE,
    soundEnabled: true,
    bestTime: null
  };

  function loadSettings() {
    try {
      if (window.localStorage) {
        var cam = localStorage.getItem("sctv_camera");
        if (cam !== null) settings.cameraView = parseInt(cam, 10) === 1 ? CAM_TOPDOWN : CAM_CHASE;
        var snd = localStorage.getItem("sctv_sound");
        if (snd !== null) settings.soundEnabled = (snd === "1");
        var bt = localStorage.getItem("sctv_bestTime_1");
        if (bt !== null && !isNaN(parseFloat(bt))) settings.bestTime = parseFloat(bt);
      }
    } catch (e) {}
  }

  function saveSettings() {
    try {
      if (window.localStorage) {
        localStorage.setItem("sctv_camera", settings.cameraView === CAM_TOPDOWN ? "1" : "0");
        localStorage.setItem("sctv_sound", settings.soundEnabled ? "1" : "0");
        if (settings.bestTime !== null) {
          localStorage.setItem("sctv_bestTime_1", settings.bestTime.toFixed(2));
        }
      }
    } catch (e) {}
  }

  loadSettings();

  // ============================================================================
  // 4. PROCEDURAL WEB AUDIO ENGINE (No external files, try/catch safe)
  // ============================================================================
  var AudioSys = (function() {
    var actx = null;
    var initialized = false;
    var masterGain = null;

    // Continuous nodes
    var engOsc1 = null;
    var engOsc2 = null;
    var engFilter = null;
    var engGain = null;

    var screechNode = null;
    var screechFilter = null;
    var screechGain = null;

    var nitroNode = null;
    var nitroFilter = null;
    var nitroGain = null;

    // Synthwave background music state
    var musicTimer = 0;
    var musicStep = 0;
    var bassNotes = [55, 55, 65.41, 55, 73.42, 65.41, 49, 49];
    var arpNotes = [220, 277.18, 329.63, 440, 329.63, 277.18, 246.94, 329.63];

    function init() {
      if (initialized) return;
      try {
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        actx = new AudioCtx();
        if (actx.state === "suspended") {
          actx.resume();
        }

        masterGain = actx.createGain();
        masterGain.gain.value = settings.soundEnabled ? 0.45 : 0.0;
        masterGain.connect(actx.destination);

        // Create noise buffer for screech, nitro, crash, drums
        var bufSize = actx.sampleRate * 2;
        var noiseBuf = actx.createBuffer(1, bufSize, actx.sampleRate);
        var out = noiseBuf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
          out[i] = Math.random() * 2 - 1;
        }

        // Engine sound (Dual oscillator + lowpass filter)
        engOsc1 = actx.createOscillator();
        engOsc2 = actx.createOscillator();
        engFilter = actx.createBiquadFilter();
        engGain = actx.createGain();

        engOsc1.type = "sawtooth";
        engOsc2.type = "triangle";
        engOsc1.frequency.value = 55;
        engOsc2.frequency.value = 110;

        engFilter.type = "lowpass";
        engFilter.frequency.value = 260;

        engGain.gain.value = 0.0;

        engOsc1.connect(engFilter);
        engOsc2.connect(engFilter);
        engFilter.connect(engGain);
        engGain.connect(masterGain);

        engOsc1.start(0);
        engOsc2.start(0);

        // Tire screech sound
        screechNode = actx.createBufferSource();
        screechNode.buffer = noiseBuf;
        screechNode.loop = true;
        screechFilter = actx.createBiquadFilter();
        screechFilter.type = "bandpass";
        screechFilter.frequency.value = 1500;
        screechFilter.Q.value = 6.0;
        screechGain = actx.createGain();
        screechGain.gain.value = 0.0;

        screechNode.connect(screechFilter);
        screechFilter.connect(screechGain);
        screechGain.connect(masterGain);
        screechNode.start(0);

        // Nitro whoosh sound
        nitroNode = actx.createBufferSource();
        nitroNode.buffer = noiseBuf;
        nitroNode.loop = true;
        nitroFilter = actx.createBiquadFilter();
        nitroFilter.type = "bandpass";
        nitroFilter.frequency.value = 420;
        nitroFilter.Q.value = 1.5;
        nitroGain = actx.createGain();
        nitroGain.gain.value = 0.0;

        nitroNode.connect(nitroFilter);
        nitroFilter.connect(nitroGain);
        nitroGain.connect(masterGain);
        nitroNode.start(0);

        initialized = true;
      } catch (e) {
        initialized = false;
      }
    }

    function updateMasterMute() {
      if (!initialized || !masterGain) return;
      try {
        masterGain.gain.value = settings.soundEnabled ? 0.45 : 0.0;
      } catch (e) {}
    }

    function silenceContinuous() {
      if (!initialized) return;
      try {
        engGain.gain.value = 0;
        screechGain.gain.value = 0;
        nitroGain.gain.value = 0;
      } catch (e) {}
    }

    function updateRacingAudio(dt, rpmRatio, throttle, isDrifting, isOffroad, isNitro, shiftTimer) {
      if (!initialized || !settings.soundEnabled) {
        silenceContinuous();
        return;
      }
      try {
        if (actx.state === "suspended") actx.resume();

        // Engine pitch & timbre
        var shiftCut = shiftTimer > 0 ? 0.35 : 1.0;
        var baseFreq = 42 + rpmRatio * 145;
        engOsc1.frequency.value = baseFreq;
        engOsc2.frequency.value = baseFreq * 1.98;
        engFilter.frequency.value = 180 + rpmRatio * 650 + (isNitro ? 350 : 0);
        engGain.gain.value = (0.10 + throttle * 0.12 + rpmRatio * 0.08) * shiftCut;

        // Drift screech or offroad rumble
        if (isDrifting) {
          screechFilter.frequency.value = 1350 + Math.sin( musicStep * 2 ) * 150;
          screechFilter.Q.value = 5.5;
          screechGain.gain.value = 0.14;
        } else if (isOffroad) {
          screechFilter.frequency.value = 260;
          screechFilter.Q.value = 1.2;
          screechGain.gain.value = 0.12;
        } else {
          screechGain.gain.value = 0.0;
        }

        // Nitro whoosh
        if (isNitro) {
          nitroFilter.frequency.value = 380 + rpmRatio * 320;
          nitroGain.gain.value = 0.24;
        } else {
          nitroGain.gain.value = 0.0;
        }
      } catch (e) {}
    }

    function updateMusic(dt, isRacingOrIntro) {
      if (!initialized || !settings.soundEnabled) return;
      musicTimer += dt;
      var stepDuration = isRacingOrIntro ? 0.14 : 0.18;
      if (musicTimer >= stepDuration) {
        musicTimer -= stepDuration;
        musicStep = (musicStep + 1) % 32;
        try {
          var now = actx.currentTime;
          // Synth bass on every step
          var bassIdx = Math.floor(musicStep / 4) % bassNotes.length;
          var bFreq = bassNotes[bassIdx] * (musicStep % 2 === 0 ? 1 : 2);
          var bOsc = actx.createOscillator();
          var bGain = actx.createGain();
          bOsc.type = "sawtooth";
          bOsc.frequency.setValueAtTime(bFreq, now);
          bGain.gain.setValueAtTime(0.06, now);
          bGain.gain.exponentialRampToValueAtTime(0.005, now + stepDuration * 0.9);
          bOsc.connect(bGain);
          bGain.connect(masterGain);
          bOsc.start(now);
          bOsc.stop(now + stepDuration);

          // Sunset synth melody on even steps
          if (musicStep % 2 === 0) {
            var arpIdx = (musicStep / 2) % arpNotes.length;
            var aOsc = actx.createOscillator();
            var aGain = actx.createGain();
            aOsc.type = "triangle";
            aOsc.frequency.setValueAtTime(arpNotes[arpIdx], now);
            aGain.gain.setValueAtTime(0.035, now);
            aGain.gain.exponentialRampToValueAtTime(0.003, now + stepDuration * 1.6);
            aOsc.connect(aGain);
            aGain.connect(masterGain);
            aOsc.start(now);
            aOsc.stop(now + stepDuration * 1.7);
          }

          // Kick pulse on 0, 4, 8, 12...
          if (musicStep % 4 === 0) {
            var kOsc = actx.createOscillator();
            var kGain = actx.createGain();
            kOsc.type = "sine";
            kOsc.frequency.setValueAtTime(115, now);
            kOsc.frequency.exponentialRampToValueAtTime(36, now + 0.11);
            kGain.gain.setValueAtTime(0.14, now);
            kGain.gain.exponentialRampToValueAtTime(0.005, now + 0.12);
            kOsc.connect(kGain);
            kGain.connect(masterGain);
            kOsc.start(now);
            kOsc.stop(now + 0.13);
          }
        } catch (e) {}
      }
    }

    function playTone(freq, duration, type, vol) {
      if (!initialized || !settings.soundEnabled) return;
      try {
        var now = actx.currentTime;
        var osc = actx.createOscillator();
        var g = actx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(vol || 0.15, now);
        g.gain.exponentialRampToValueAtTime(0.005, now + duration);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      } catch (e) {}
    }

    function playMenuMove() {
      playTone(520, 0.07, "triangle", 0.12);
    }

    function playMenuSelect() {
      playTone(660, 0.09, "triangle", 0.15);
      setTimeout(function() { playTone(880, 0.14, "triangle", 0.15); }, 60);
    }

    function playCountdown(isGo) {
      if (isGo) {
        playTone(880, 0.45, "sawtooth", 0.20);
        playTone(1108.7, 0.45, "triangle", 0.18);
      } else {
        playTone(440, 0.22, "sine", 0.18);
      }
    }

    function playCheckpoint() {
      playTone(587.33, 0.12, "triangle", 0.18);
      setTimeout(function() { playTone(783.99, 0.12, "triangle", 0.18); }, 80);
      setTimeout(function() { playTone(1174.66, 0.30, "triangle", 0.22); }, 160);
    }

    function playCrash() {
      if (!initialized || !settings.soundEnabled) return;
      try {
        var now = actx.currentTime;
        var osc = actx.createOscillator();
        var g = actx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.28);
        g.gain.setValueAtTime(0.32, now);
        g.gain.exponentialRampToValueAtTime(0.01, now + 0.30);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.32);
      } catch (e) {}
    }

    return {
      init: init,
      updateMasterMute: updateMasterMute,
      silenceContinuous: silenceContinuous,
      updateRacingAudio: updateRacingAudio,
      updateMusic: updateMusic,
      playMenuMove: playMenuMove,
      playMenuSelect: playMenuSelect,
      playCountdown: playCountdown,
      playCheckpoint: playCheckpoint,
      playCrash: playCrash
    };
  })();

  // ============================================================================
  // 5. PRE-RENDERED OFFSCREEN CANVASES (Static Art & Sprites Cache)
  // ============================================================================
  var Sprites = {};

  function createOffscreen(w, h) {
    var c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  }

  function buildCachedArt() {
    // 1. Sunset Sky & Sun Glow Canvas (1280 x 380)
    var skyC = createOffscreen(WIDTH, 380);
    var sctx = skyC.getContext("2d");
    var skyGrad = sctx.createLinearGradient(0, 0, 0, 360);
    skyGrad.addColorStop(0.0, "#100926");
    skyGrad.addColorStop(0.35, "#3b1542");
    skyGrad.addColorStop(0.68, "#9c2b43");
    skyGrad.addColorStop(0.88, "#f06835");
    skyGrad.addColorStop(1.0, "#ffcb5c");
    sctx.fillStyle = skyGrad;
    sctx.fillRect(0, 0, WIDTH, 380);

    // Sun halo
    var sunX = 380;
    var sunY = 255;
    var sunHalo = sctx.createRadialGradient(sunX, sunY, 20, sunX, sunY, 280);
    sunHalo.addColorStop(0.0, "rgba(255, 248, 200, 0.95)");
    sunHalo.addColorStop(0.25, "rgba(255, 190, 85, 0.55)");
    sunHalo.addColorStop(0.6, "rgba(240, 95, 50, 0.18)");
    sunHalo.addColorStop(1.0, "rgba(240, 95, 50, 0.0)");
    sctx.fillStyle = sunHalo;
    sctx.fillRect(0, 0, WIDTH, 380);

    // Stratified sunset clouds
    sctx.fillStyle = "rgba(70, 20, 55, 0.35)";
    for (var ci = 0; ci < 18; ci++) {
      var cx = (ci * 137) % WIDTH;
      var cy = 70 + (ci * 43) % 150;
      var cw = 140 + (ci * 29) % 160;
      var ch = 8 + (ci % 4) * 4;
      sctx.fillRect(cx, cy, cw, ch);
    }

    // Sun disc with horizontal synth/sunset scan cuts
    sctx.save();
    sctx.beginPath();
    sctx.arc(sunX, sunY, 68, 0, Math.PI * 2);
    sctx.clip();
    var discGrad = sctx.createLinearGradient(0, sunY - 68, 0, sunY + 68);
    discGrad.addColorStop(0, "#fffbe0");
    discGrad.addColorStop(0.6, "#ffae38");
    discGrad.addColorStop(1, "#e83b3b");
    sctx.fillStyle = discGrad;
    sctx.fillRect(sunX - 70, sunY - 70, 140, 140);
    sctx.fillStyle = "rgba(150, 40, 55, 0.35)";
    for (var sy = sunY + 10; sy < sunY + 68; sy += 11) {
      sctx.fillRect(sunX - 70, sy, 140, 3);
    }
    sctx.restore();
    Sprites.sky = skyC;

    // 2. Parallax Coastal Mountains & Ocean (1280 x 160, tileable horizontally)
    var mtnC = createOffscreen(WIDTH, 160);
    var mctx = mtnC.getContext("2d");

    // Distant mountain range
    mctx.fillStyle = "#2d1436";
    mctx.beginPath();
    mctx.moveTo(0, 160);
    var mPts1 = [0,95, 110,55, 220,82, 340,35, 480,75, 610,42, 740,85, 890,28, 1020,65, 1150,48, 1280,95];
    for (var m1 = 0; m1 < mPts1.length; m1 += 2) {
      mctx.lineTo(mPts1[m1], mPts1[m1 + 1]);
    }
    mctx.lineTo(WIDTH, 160);
    mctx.closePath();
    mctx.fill();

    // Closer coastal cliffs & silhouettes
    mctx.fillStyle = "#1c0b26";
    mctx.beginPath();
    mctx.moveTo(0, 160);
    var mPts2 = [0,115, 90,88, 190,110, 310,72, 430,108, 560,78, 690,112, 820,68, 960,104, 1110,80, 1280,115];
    for (var m2 = 0; m2 < mPts2.length; m2 += 2) {
      mctx.lineTo(mPts2[m2], mPts2[m2 + 1]);
    }
    mctx.lineTo(WIDTH, 160);
    mctx.closePath();
    mctx.fill();

    // Ocean strip at base of mountains
    var seaGrad = mctx.createLinearGradient(0, 122, 0, 160);
    seaGrad.addColorStop(0, "#5c2448");
    seaGrad.addColorStop(0.4, "#b8463e");
    seaGrad.addColorStop(1, "#232946");
    mctx.fillStyle = seaGrad;
    mctx.fillRect(0, 124, WIDTH, 36);

    // Shimmer lines on water
    mctx.fillStyle = "rgba(255, 215, 120, 0.55)";
    for (var wi = 0; wi < 45; wi++) {
      var wx = (wi * 73) % WIDTH;
      var wy = 127 + (wi % 6) * 5;
      mctx.fillRect(wx, wy, 24 + (wi % 4) * 12, 2);
    }
    Sprites.mountains = mtnC;

    // 3. Soft Radial Glow Sprite (128 x 128) - Replaces expensive shadowBlur
    var glowC = createOffscreen(128, 128);
    var gctx = glowC.getContext("2d");
    var rg = gctx.createRadialGradient(64, 64, 4, 64, 64, 62);
    rg.addColorStop(0.0, "rgba(255, 240, 190, 0.9)");
    rg.addColorStop(0.4, "rgba(255, 160, 60, 0.4)");
    rg.addColorStop(1.0, "rgba(255, 120, 30, 0.0)");
    gctx.fillStyle = rg;
    gctx.fillRect(0, 0, 128, 128);
    Sprites.glowWarm = glowC;

    // Cyan Nitro Glow Sprite
    var nGlowC = createOffscreen(128, 128);
    var ngctx = nGlowC.getContext("2d");
    var nrg = ngctx.createRadialGradient(64, 64, 4, 64, 64, 62);
    nrg.addColorStop(0.0, "rgba(220, 255, 255, 0.95)");
    nrg.addColorStop(0.4, "rgba(40, 190, 255, 0.55)");
    nrg.addColorStop(1.0, "rgba(0, 100, 255, 0.0)");
    ngctx.fillStyle = nrg;
    ngctx.fillRect(0, 0, 128, 128);
    Sprites.glowCyan = nGlowC;

    // 4. Roadside Prop: Palm Tree (180 x 260)
    var palmC = createOffscreen(180, 260);
    var pctx = palmC.getContext("2d");
    // Trunk
    pctx.strokeStyle = "#2b1924";
    pctx.lineWidth = 14;
    pctx.lineCap = "round";
    pctx.beginPath();
    pctx.moveTo(90, 255);
    pctx.quadraticCurveTo(68, 165, 95, 72);
    pctx.stroke();
    // Sunset rim highlight on trunk
    pctx.strokeStyle = "#9e4738";
    pctx.lineWidth = 4;
    pctx.beginPath();
    pctx.moveTo(86, 252);
    pctx.quadraticCurveTo(64, 165, 92, 74);
    pctx.stroke();
    // Palm fronds
    var frondAngles = [-2.6, -2.0, -1.3, -0.5, 0.2, 0.8, 1.5];

  // 6. INPUT SYSTEM (TV Remote & Keyboard)

  var keys = {
    left: false,
    right: false,
    up: false,
    down: false,
    ok: false
  };

  // TV Remote ergonomics helper:
  // On a TV remote, pressing Left/Right or OK with one thumb releases Up.
  // throttleAssistTimer keeps drive momentum briefly while steering or boosting
  // unless Down (Brake) is pressed.
  var throttleAssistTimer = 0;
  var nitroBurstTimer = 0;

  function onKeyDown(e) {
    var code = e.keyCode || e.which;
    var handled = false;

    if (code === KEY_LEFT) { keys.left = true; handled = true; }
    else if (code === KEY_RIGHT) { keys.right = true; handled = true; }
    else if (code === KEY_UP) { keys.up = true; throttleAssistTimer = 2.4; handled = true; }
    else if (code === KEY_DOWN) { keys.down = true; throttleAssistTimer = 0; handled = true; }
    else if (code === KEY_OK) { keys.ok = true; handled = true; }
    else if (code === KEY_BACK_TIZEN || code === KEY_BACKSPACE || code === KEY_ESCAPE) {
      handled = true;
    }

    if (handled) {
      e.preventDefault();
      e.stopPropagation();
    }

    if (e.repeat) return;

    // Handle discrete menu & state transitions
    AudioSys.init();

    if (gameState === STATE_SPLASH) {
      if (code === KEY_OK || code === KEY_UP) {
        AudioSys.playMenuSelect();
        openMainMenu();
      }
      return;
    }

    if (gameState === STATE_MENU) {
      handleMenuInput(code, mainMenuItems, onMainMenuSelect);
      return;
    }

    if (gameState === STATE_PAUSED) {
      if (code === KEY_BACK_TIZEN || code === KEY_BACKSPACE || code === KEY_ESCAPE) {
        AudioSys.playMenuSelect();
        gameState = STATE_RACING;
      } else {
        handleMenuInput(code, pauseMenuItems, onPauseMenuSelect);
      }
      return;
    }

    if (gameState === STATE_RESULTS) {
      handleMenuInput(code, resultsMenuItems, onResultsMenuSelect);
      return;
    }

    if (gameState === STATE_INTRO) {
      if (code === KEY_OK) {
        // Skip fly-over directly to countdown / start
        if (introPhase === 0) {
          AudioSys.playMenuSelect();
          introPhase = 1;
          introTimer = 0;
          countdownLastBeep = 4;
        }
      } else if (code === KEY_BACK_TIZEN || code === KEY_BACKSPACE || code === KEY_ESCAPE) {
        AudioSys.playMenuSelect();
        openPauseMenu();
      }
      return;
    }

    if (gameState === STATE_RACING) {
      if (code === KEY_BACK_TIZEN || code === KEY_BACKSPACE || code === KEY_ESCAPE) {
        AudioSys.playMenuSelect();
        AudioSys.silenceContinuous();
        openPauseMenu();
      } else if (code === KEY_OK) {
        // Trigger Nitro burst (works both for short tap and hold on TV remote)
        if (player.nitro > 8) {
          nitroBurstTimer = 1.65;
          throttleAssistTimer = Math.max(throttleAssistTimer, 2.4);
        }
      }
    }
  }

  function onKeyUp(e) {
    var code = e.keyCode || e.which;
    if (code === KEY_LEFT) keys.left = false;
    else if (code === KEY_RIGHT) keys.right = false;
    else if (code === KEY_UP) keys.up = false;
    else if (code === KEY_DOWN) keys.down = false;
    else if (code === KEY_OK) keys.ok = false;
  }

  window.addEventListener("keydown", onKeyDown, false);
  window.addEventListener("keyup", onKeyUp, false);

  // ============================================================================
  // 7. TRACK GENERATION & MINIMAP PRE-RENDERING
  // ============================================================================
  var currentLevel = LEVELS[0];
  var segments = [];
  var trackLength = 0;
  var checkpointSegments = [];
  var minimapCanvas = createOffscreen(200, 160);
  var minimapPoints = [];

  function easeIn(a, b, p) { return a + (b - a) * p * p; }
  function easeOut(a, b, p) { return a + (b - a) * (1 - (1 - p) * (1 - p)); }
  function easeInOut(a, b, p) { return a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5); }

  function buildTrack(level) {
    segments = [];
    checkpointSegments = [];
    var segLen = level.segmentLength;
    var curY = 0;

    function addSegment(curve, y) {
      var idx = segments.length;
      segments.push({
        index: idx,
        z: idx * segLen,
        y: curY,
        nextY: y,
        curve: curve,
        sprites: [],
        isCheckpoint: false,
         isFinish: false,
        projX: 0,
        projY: 0,
        projW: 0,
        projScale: 0,
        clipY: HEIGHT
      });
      curY = y;
    }

    function addRoadSection(enter, hold, exit, curve, hillHeight) {
      var startY = curY;
      var endY = startY + hillHeight * segLen;
      var total = enter + hold + exit;
      var n;
      for (n = 0; n < enter; n++) {
        addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
      }
      for (n = 0; n < hold; n++) {
        addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
      }
      for (n = 0; n < exit; n++) {
        addSegment(easeInOut(curve, 0, n / exit), easeInOut(startY, endY, (enter + hold + n) / total));
      }
    }

    var bp = level.trackBlueprint;
    for (var i = 0; i < bp.length; i++) {
      addRoadSection(bp[i][0], bp[i][1], bp[i][2], bp[i][3], bp[i][4]);
    }

    var totalSegs = segments.length;
    trackLength = totalSegs * segLen;

    // Place evenly spaced Checkpoints & Final Finish Line
    var cpInterval = Math.floor((totalSegs - 180) / level.checkpointCount);
    for (var c = 1; c <= level.checkpointCount; c++) {
      var cpIdx = c * cpInterval;
      if (c === level.checkpointCount) {
        cpIdx = totalSegs - 120;
        segments[cpIdx].isFinish = true;
      } else {
        segments[cpIdx].isCheckpoint = true;
      }
      checkpointSegments.push(cpIdx);
    }

    // Populate roadside props (palm trees, boulders, street lamps, chevron signs, billboards)
    for (var s = 20; s < totalSegs - 40; s++) {
      var seg = segments[s];
      // Street lamps on right side every 28 segments
      if (s % 28 === 0) {
        seg.sprites.push({ type: "lamp", offset: 1.35 });
      }
      // Palm trees along ocean coast (left side) and right side
      if (s % 9 === 0) {
        seg.sprites.push({ type: "palm", offset: -1.45 - (s % 3) * 0.35 });
      }
      if (s % 15 === 0) {
        seg.sprites.push({ type: "palm", offset: 1.65 + (s % 4) * 0.4 });
      }
      // Coastal cliff boulders on right side
      if (s % 13 === 0) {
        seg.sprites.push({ type: "boulder", offset: 1.55 + (s % 3) * 0.5 });
      }
      // Curve warning signs on sharp turns
      if (Math.abs(seg.curve) > 2.4 && s % 10 === 0) {
        var signSide = seg.curve > 0 ? -1.25 : 1.25;
        seg.sprites.push({ type: "sign", offset: signSide, flip: seg.curve < 0 });
      }
      // Billboards every 95 segments
      if (s % 95 === 0) {
        seg.sprites.push({ type: "billboard", offset: (s % 190 === 0) ? -1.75 : 1.75 });
      }
    }

    // Build 2D Minimap path from segment curvature
    minimapPoints = [];
    var mx = 0, my = 0, mAngle = -Math.PI / 2;
    var minX = 0, maxX = 0, minY = 0, maxY = 0;

    for (var m = 0; m < totalSegs; m++) {
      mAngle += segments[m].curve * 0.00038;
      mx += Math.cos(mAngle) * 1.0;
      my += Math.sin(mAngle) * 1.0;
      minimapPoints.push({ x: mx, y: my });
      if (mx < minX) minX = mx;
      if (mx > maxX) maxX = mx;
      if (my < minY) minY = my;
      if (my > maxY) maxY = my;
    }

    var mapW = Math.max(1, maxX - minX);
    var mapH = Math.max(1, maxY - minY);
    var pad = 18;
    var scaleX = (minimapCanvas.width - pad * 2) / mapW;
    var scaleY = (minimapCanvas.height - pad * 2) / mapH;
    var mapScale = Math.min(scaleX, scaleY);
    var offX = (minimapCanvas.width - mapW * mapScale) * 0.5 - minX * mapScale;
    var offY = (minimapCanvas.height - mapH * mapScale) * 0.5 - minY * mapScale;

    for (var p = 0; p < minimapPoints.length; p++) {
      minimapPoints[p].sx = offX + minimapPoints[p].x * mapScale;
      minimapPoints[p].sy = offY + minimapPoints[p].y * mapScale;
    }

    // Render static minimap track to offscreen canvas
    var mmCtx = minimapCanvas.getContext("2d");
    mmCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
    mmCtx.fillStyle = "rgba(10, 14, 26, 0.78)";
    mmCtx.strokeStyle = "rgba(255, 180, 70, 0.45)";
    mmCtx.lineWidth = 2;
    mmCtx.fillRect(2, 2, minimapCanvas.width - 4, minimapCanvas.height - 4);
    mmCtx.strokeRect(2, 2, minimapCanvas.width - 4, minimapCanvas.height - 4);

    // Track shadow/outline
    mmCtx.strokeStyle = "#1e272e";
    mmCtx.lineWidth = 7;
    mmCtx.lineCap = "round";
    mmCtx.beginPath();
    for (var k = 0; k < minimapPoints.length; k += 12) {
      if (k === 0) mmCtx.moveTo(minimapPoints[k].sx, minimapPoints[k].sy);
      else mmCtx.lineTo(minimapPoints[k].sx, minimapPoints[k].sy);
    }
    mmCtx.stroke();

    // Track inner line
    mmCtx.strokeStyle = "#ffae42";
    mmCtx.lineWidth = 3;
    mmCtx.stroke();

    // Draw Checkpoint ticks on minimap
    for (var cp = 0; cp < checkpointSegments.length; cp++) {
      var pt = minimapPoints[checkpointSegments[cp]];
      mmCtx.fillStyle = (cp === checkpointSegments.length - 1) ? "#ff3838" : "#48dbfb";
      mmCtx.fillRect(pt.sx - 3, pt.sy - 3, 6, 6);
    }
  }

  function spawnParticle(type, x, y, vx, vy, size, maxLife, color) {
    for (var i = 0; i < MAX_PARTICLES; i++) {
      var p = particles[i];
      if (!p.active) {
        p.active = true;
        p.type = type;
        p.x = x;
        p.y = y;
        p.vx = vx;
        p.vy = vy;
        p.size = size;
        p.alpha = 1.0;
        p.life = 0;
        p.maxLife = maxLife;
        p.color = color;
        return;
      }
    }
  }

  function updateParticles(dt) {
    for (var i = 0; i < MAX_PARTICLES; i++) {
      var p = particles[i];
      if (!p.active) continue;
      p.life += dt;
      if (p.life >= p.maxLife) {
        p.active = false;
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.alpha = 1.0 - (p.life / p.maxLife);
      if (p.type === 0 || p.type === 1) {
        p.size += dt * 32;
      }
    }
  }
